name: Housing Agent

on:
  workflow_dispatch:

  schedule:
    # Daytime (08:00–22:00 Italy) every 30 minutes
    - cron: "0,30 6-20 * * *"

    # Night (22:00–08:00 Italy) every 2 hours
    - cron: "0 22,0,2,4,6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Verify dependencies
        run: |
          python -c "import pandas, requests; print('Dependencies OK')"

      - name: Run Housing Agent
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python 05_Python/housing_agent.py

      - name: Commit updated database
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add 05_Python/Database/*.csv 05_Python/Database/*.json
          git diff --cached --quiet || git commit -m "Update housing database"
          git push
